<title>平衡之道</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
  :root {
    color-scheme: light;
    --ink: #1E2B33;
    --sky: #8FD0E6;
    --red: #E2483D;
    --yellow: #F4C542;
    --teal: #2A9D8F;
    --grass: #7DB65F;
    --card: #FFFFFF;
    --muted: #5B6B75;
    --line: #D5E3E8;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
    overflow: hidden;
  }
  #app { position: relative; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; inset: 0; display: block; }

  #toast {
    position: absolute; left: 50%; top: 108px;
    transform: translate(-50%, -8px);
    max-width: min(560px, calc(100% - 32px));
    background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 12px;
    font-weight: 700; font-size: 15px; line-height: 1.5; text-align: center;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #ov {
    position: absolute; inset: 0; overflow: auto;
    display: grid; place-items: center;
    padding: 16px; background: rgba(30, 43, 51, .38);
  }
  .card {
    background: var(--card); border: 3px solid var(--ink); border-radius: 18px;
    box-shadow: 6px 6px 0 var(--ink);
    width: 100%; max-width: 560px; padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .eyebrow { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: .12em; color: var(--red); }
  h1 { margin: 0; font-size: clamp(40px, 9vw, 60px); font-weight: 900; line-height: 1.05; letter-spacing: .04em; text-wrap: balance; }
  h2 { margin: 0; font-size: 28px; font-weight: 900; line-height: 1.2; text-wrap: balance; }
  p { margin: 0; line-height: 1.7; }
  .lead { color: var(--muted); }
  .story { font-size: 16px; }
  .goal { background: #FFF3C9; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
  ul.pts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; line-height: 1.6; }

  .chs { display: flex; flex-direction: column; gap: 8px; }
  .ch {
    display: flex; align-items: center; gap: 14px;
    font: inherit; color: inherit; text-align: left;
    background: #fff; border: 2px solid var(--ink); border-radius: 14px;
    padding: 10px 14px; cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  button.ch:not(:disabled):hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .ch:disabled, .ch.soon { opacity: .5; cursor: default; border-style: dashed; }
  .ch .num {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--yellow); border: 2px solid var(--ink);
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: 20px;
  }
  .ch .meta { flex: 1; display: flex; flex-direction: column; }
  .ch .meta small { color: var(--muted); font-size: 13px; }
  .ch .st { font-size: 13px; font-weight: 700; color: var(--muted); }
  .ch .st.ok { color: var(--teal); }

  .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .keys span { display: flex; align-items: center; gap: 6px; }
  kbd {
    font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; font-size: 13px; color: var(--ink);
    background: #EEF6F8; border: 1.5px solid var(--ink); border-bottom-width: 3px; border-radius: 6px;
    padding: 0 6px; min-width: 22px; text-align: center;
  }

  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    font: inherit; font-weight: 900; font-size: 16px; cursor: pointer;
    padding: 10px 18px; border-radius: 12px; border: 2px solid var(--ink);
    background: #fff; color: var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 3px 3px 0 var(--ink); }
  .btn.primary { background: var(--red); color: #fff; }
  .btn:focus-visible, .ch:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 110px; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; }
  .stat b { display: block; font-family: "Baloo 2", system-ui, sans-serif; font-size: 26px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); }
  .know { background: #E4F4F1; border: 2px solid var(--teal); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .know b { color: var(--teal); }

  #touch {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
    pointer-events: none;
  }
  .tg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; pointer-events: auto; }
  .tb {
    font: inherit; font-weight: 900; font-size: 13px; color: var(--ink);
    background: rgba(255, 255, 255, .88); border: 2px solid var(--ink); border-radius: 14px;
    min-width: 64px; height: 44px; padding: 0 8px; touch-action: none;
  }
  .tb.big { height: 64px; font-size: 16px; }
  .tb.pedal { background: #FFF1C2; }
  .tb.on { background: var(--yellow); transform: translateY(2px); }
  @media (prefers-reduced-motion: reduce) {
    .btn, .ch, #toast { transition: none; }
  }
</style>

<div id="app">
  <canvas id="c"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="touch" hidden>
    <div class="tg">
      <button class="tb" data-k="crank">↑ 轉踏板</button>
      <button class="tb" data-k="foot">F 放腳</button>
      <button class="tb big" data-k="left">◀ 左轉</button>
      <button class="tb big" data-k="right">右轉 ▶</button>
    </div>
    <div class="tg">
      <button class="tb" data-k="rear">S 後煞</button>
      <button class="tb" data-k="front">W 前煞</button>
      <button class="tb big pedal" data-k="L">A 左腳</button>
      <button class="tb big pedal" data-k="R">D 右腳</button>
    </div>
  </div>
  <div id="ov" hidden></div>
</div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const FONT = '"Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif';
  const NUMF = '"Baloo 2", "Noto Sans TC", system-ui, sans-serif';
  const INK = '#1E2B33', RED = '#E2483D', YEL = '#F4C542', TEAL = '#2A9D8F', SKIN = '#F2C29B', PANTS = '#3D5A8C';
  const LEAN_MAX = 0.78;       // 超過這個傾角（約 45°）就摔車
  const ZONE = 7;              // 停車格長度（公尺）

  const $ = s => document.querySelector(s);
  const cv = $('#c'), ctx = cv.getContext('2d');
  const ov = $('#ov'), toastEl = $('#toast'), touchEl = $('#touch');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const hash = k => { const s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const norm = a => ((a % TAU) + TAU) % TAU;

  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = cv.parentElement.getBoundingClientRect();
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ─────────────────────────── 章節資料 ───────────────────────────
  const CH = [
    {
      id: 1, name: '五歲．後院', sub: '平衡入門', view: 'side', scene: 'yard', goal: 120, vmax: 5, noise: 1.0,
      story: '五歲生日那天，你收到第一台腳踏車。爸爸扶著後座說：「別怕，我抓著。」',
      goalText: '騎到後院盡頭的旗子（120 公尺）',
      points: ['A、D 左右交替踩踏板，連踩同一腳會卡住', '車往哪邊倒，就按 ← / → 把龍頭轉向那邊', '看畫面上方的水平儀，讓泡泡待在中間'],
      card: ['為什麼騎起來就不會倒？', '車子往一邊倒時，把龍頭轉向同一邊，輪子就會跑回你的重心下方，把車扶正。速度越快，這個修正越有效，所以慢慢騎反而最難平衡。']
    },
    {
      id: 2, name: '起步與停車', sub: '踏板位置、煞車、放腳', view: 'side', scene: 'street', goal: 175, vmax: 6, noise: 0.8,
      stops: [40, 88, 136],
      story: '你已經會騎了，但每次停車都有點狼狽。今天在巷子裡練習好好起步、穩穩停下。',
      goalText: '在 3 個停車格內停好，再騎到終點（175 公尺）',
      points: ['起步前按 ↑ 把右踏板轉到約 2 點鐘，再按 D', '按住 S 用後煞減速；W 前煞很猛，高速別用力按', '快停住時按 F 伸腳，停在框框裡'],
      card: ['起步的「兩點鐘」法則', '起步前把踏板轉到約兩點鐘方向，第一腳往下踩的行程最長、力量最大，車子一下就有足夠速度保持平衡。停車時先用後煞減速，快停住才伸腳。']
    },
    {
      id: 3, name: '公園彎道', sub: '傾斜與反向轉向', view: 'top', scene: 'park', vmax: 7, noise: 0.55,
      story: '公園的步道彎來彎去。騎車轉彎靠的不只是轉龍頭，更要讓車身傾斜。',
      goalText: '沿著步道騎到終點，別衝進草地',
      points: ['視角改成從上往下看，車頭永遠朝上', '想右轉：先輕點 ← 讓車身往右倒，再按 → 穩住（左轉相反）', '彎越急越要先減速，傾斜太多會打滑'],
      card: ['反向轉向（counter-steering）', '想往右轉，先把龍頭輕輕往左一帶，車身就會往右倒，接著順著傾斜轉過去。騎得比慢跑快的人，幾乎都在不知不覺中這樣做。']
    }
  ];
  const FUTURE = [
    { id: 4, name: '上坡下坡', sub: '變速與下坡控速' },
    { id: 5, name: '城市通勤', sub: '紅綠燈、手勢與鈴鐺' },
    { id: 6, name: '雨夜挑戰', sub: '濕滑路面與車燈' }
  ];

  const REASONS = {
    slow:    ['速度太慢，失去平衡', '車速太慢時，轉龍頭也救不回來。持續用 A、D 交替踩踏板保持速度；要停下來時，快停住前先按 F 伸腳。'],
    left:    ['車子往左倒了', '往哪邊倒，龍頭就往哪邊轉。車子往左倒時按 ←，讓輪子回到身體下方。速度越快，修正越容易。'],
    right:   ['車子往右倒了', '往哪邊倒，龍頭就往哪邊轉。車子往右倒時按 →，讓輪子回到身體下方。速度越快，修正越容易。'],
    slip:    ['傾斜太多，輪胎打滑', '彎道越急、速度越快，需要的傾斜就越大。進彎前先按 S 減速，車身就不用倒那麼深。'],
    flip:    ['前煞捏太急，翻車了', '高速時猛按前煞（W），重心往前衝會把你甩出去。先用後煞（S）減速，前煞只輕輕輔助。'],
    foot:    ['高速伸腳，腳被地面拖住', '伸腳落地（F）要等車幾乎停下才做。先按 S 煞車，速度降下來再放腳。'],
    overrun: ['衝過停車格了', '提早按住 S 用後煞慢慢減速，讓車停在框框裡，再按 F 伸腳。'],
    offroad: ['衝出彎道了', '想右轉要先讓車身往右倒：輕點 ← 再用 → 穩住，左轉相反。來不及就先減速。']
  };

  // ─────────────────────────── 第 3 章：步道 ───────────────────────────
  const TRACK = (() => {
    const segs = [[25], [14, 90], [14], [12, -110], [12], [9, 170], [18], [15, -80], [10], [11, 60], [22]];
    const pts = [{ x: 0, y: 0, h: 0 }], curves = [];
    let x = 0, y = 0, h = 0; const step = 0.5;
    for (const s of segs) {
      if (s.length === 1) {
        for (let i = 0; i < s[0] / step; i++) { x += step * Math.sin(h); y -= step * Math.cos(h); pts.push({ x, y, h }); }
      } else {
        const [R, deg] = s, rad = deg * Math.PI / 180, n = Math.round(R * Math.abs(rad) / step);
        curves.push({ i: pts.length, dir: Math.sign(deg), R });
        for (let i = 0; i < n; i++) { h += rad / n; x += step * Math.sin(h); y -= step * Math.cos(h); pts.push({ x, y, h }); }
      }
    }
    // 裝飾：樹和花叢，避開步道
    let seed = 12345; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const p of pts) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
    const deco = [];
    for (let n = 0; n < 420; n++) {
      const dx = minX - 30 + rnd() * (maxX - minX + 60), dy = minY - 30 + rnd() * (maxY - minY + 60);
      let md = 1e9;
      for (let i = 0; i < pts.length; i += 3) { const a = pts[i].x - dx, b = pts[i].y - dy; md = Math.min(md, a * a + b * b); }
      md = Math.sqrt(md);
      const t = rnd();
      if (t < 0.55 && md > 4.6) deco.push({ x: dx, y: dy, k: 'tree', r: 1.3 + rnd() * 1.2 });
      else if (t >= 0.55 && md > 3.4) deco.push({ x: dx, y: dy, k: 'flower', r: 0.5 + rnd() * 0.5, c: ['#F28DA6', '#F4C542', '#FFFFFF', '#B79CE8'][Math.floor(rnd() * 4)] });
    }
    return { pts, curves, deco };
  })();

  // ─────────────────────────── 存檔 ───────────────────────────
  const SAVE_KEY = 'balance-way-v1';
  function loadDone() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}').done || []; } catch { return []; } }
  function markDone(id) {
    const d = loadDone(); if (!d.includes(id)) d.push(id);
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ done: d })); } catch {}
  }

  // ─────────────────────────── 音效 ───────────────────────────
  const sfx = {
    ac: null, muted: false, brakeG: null, rollG: null,
    init() {
      if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
      try {
        const ac = this.ac = new (window.AudioContext || window.webkitAudioContext)();
        const noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = noise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = noise;
        // 煞車尖叫
        const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 2400;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = 12;
        this.brakeG = ac.createGain(); this.brakeG.gain.value = 0;
        o.connect(bp).connect(this.brakeG).connect(ac.destination); o.start();
        // 輪胎滾動聲
        const ns = ac.createBufferSource(); ns.buffer = noise; ns.loop = true;
        const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
        this.rollG = ac.createGain(); this.rollG.gain.value = 0;
        ns.connect(lp).connect(this.rollG).connect(ac.destination); ns.start();
      } catch { this.ac = null; }
    },
    tone(f, dur, type = 'sine', vol = 0.1, when = 0) {
      if (!this.ac || this.muted) return;
      const t = this.ac.currentTime + when, o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.02);
    },
    burst(dur, freq, vol) {
      if (!this.ac || this.muted) return;
      const t = this.ac.currentTime, s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
      s.buffer = this.noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f).connect(g).connect(this.ac.destination); s.start(t); s.stop(t + dur);
    },
    pedal(f, combo) { this.tone((f === 'L' ? 330 : 392) * (combo >= 4 ? 1.5 : 1), 0.08, 'triangle', 0.07); },
    bell() { this.tone(2093, 1.1, 'sine', 0.12); this.tone(2637, 0.8, 'sine', 0.06); this.tone(2093, 0.9, 'sine', 0.08, 0.14); },
    clunk() { this.tone(110, 0.14, 'square', 0.05); },
    tick() { this.tone(900, 0.03, 'square', 0.03); },
    thud() { this.burst(0.45, 380, 0.5); this.tone(70, 0.3, 'sine', 0.25); },
    ding() { this.tone(880, 0.18, 'sine', 0.1); this.tone(1320, 0.35, 'sine', 0.08, 0.1); },
    win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.09, i * 0.12)); },
    update() {
      if (!this.ac) return;
      const on = S.mode === 'play' && !this.muted;
      const braking = on && (K.rear || K.front) && S.v > 1 && !S.crashT;
      this.brakeG.gain.setTargetAtTime(braking ? 0.018 : 0, this.ac.currentTime, 0.05);
      this.rollG.gain.setTargetAtTime(on ? Math.min(0.06, S.v * 0.01) : 0, this.ac.currentTime, 0.1);
    }
  };

  // ─────────────────────────── 狀態 ───────────────────────────
  const K = {};
  const S = { mode: 'menu', ch: 0, attempts: 0, frames: [], rp: 0, toastT: {}, flags: {} };

  function resetRun() {
    const c = CH[S.ch];
    Object.assign(S, {
      t: 0, x: 0, v: 0, lean: 0, leanV: 0, steer: 0, noise: 0,
      crank: c.id === 2 ? Math.PI * 1.05 : Math.PI / 3, crankVis: 0,
      lastFoot: null, lastPedalT: -9, lastInt: 0, combo: 0,
      footDown: c.id === 2, assist: c.id === 1 ? 1 : 0, dadPushing: false, dadX: -1.3, dadV: 0, dadPhase: 0,
      frontHold: 0, pitch: 0, crashT: 0, crashType: null, crashKey: null,
      wheelA: 0, frames: [], stopIdx: 0, toastT: {}, flags: {},
      px: 0, py: 0, heading: 0, prog: 0
    });
    if (c.id === 3) { S.v = 3.2; S.footDown = false; }
    S.crankVis = S.crank;
  }

  // ─────────────────────────── 提示 ───────────────────────────
  let toastTimer;
  function toast(msg, dur = 2800) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), dur);
  }
  function toastOnce(key, msg, cool = 3, dur) {
    if ((S.toastT[key] ?? -99) + cool > S.t) return;
    S.toastT[key] = S.t; toast(msg, dur);
  }
  function hideToast() { clearTimeout(toastTimer); toastEl.classList.remove('show'); }

  // ─────────────────────────── 操作 ───────────────────────────
  function pedal(f) {
    if (S.mode !== 'play' || S.crashT) return;
    const c = CH[S.ch];
    S.footDown = false;
    if (c.id === 1 && !S.dadPushing) { S.dadPushing = true; toast('爸爸扶著你往前推，繼續 A、D 交替踩！'); }
    if (S.lastFoot === f) {
      S.v *= 0.85; S.combo = 0; S.leanV += (Math.random() - 0.5) * 0.6;
      toastOnce('same', '同一隻腳連踩，踏板卡住了！要 A、D 左右交替', 2.5);
      sfx.clunk(); return;
    }
    const interval = S.t - S.lastPedalT;
    if (S.lastFoot && interval < 1.2 && S.lastInt > 0 && Math.abs(interval - S.lastInt) / S.lastInt < 0.3) S.combo++;
    else if (interval >= 1.2) S.combo = 0;
    S.lastInt = interval; S.lastPedalT = S.t; S.lastFoot = f;

    let imp;
    if (S.v < 0.6) {
      // 起步：看踩下去的那隻腳的踏板在不在「兩點鐘」附近
      const a = norm(S.crank + (f === 'L' ? Math.PI : 0));
      if (a > 0.3 && a < 1.8) {
        imp = 2.2;
        if (c.id === 2) toast('漂亮的起步！踏板在高位，第一腳最有力');
      } else {
        imp = 0.7; S.leanV += (Math.random() < 0.5 ? -1 : 1) * 0.5;
        if (c.id >= 2) toastOnce('lowstart', '踏板在低位，起步沒力又搖晃。停下時按 ↑ 把踏板轉到約 2 點鐘', 4, 3400);
      }
    } else {
      imp = 0.55 * (1 - S.v / c.vmax) * (1 + Math.min(S.combo, 10) * 0.03);
    }
    S.v = Math.max(0, S.v + Math.max(0, imp));
    S.crank += Math.PI;
    sfx.pedal(f, S.combo);
  }
  function toggleFoot() {
    if (S.mode !== 'play' || S.crashT) return;
    S.footDown = !S.footDown; sfx.tick();
  }
  function adjustCrank() {
    if (S.mode !== 'play' || S.crashT) return;
    if (S.v < 0.6) { S.crank -= Math.PI / 6; sfx.tick(); }
    else toastOnce('crankmove', '騎行中不用調踏板，停下來再轉', 4);
  }

  const KEYMAP = { KeyA: 'L', KeyD: 'R', ArrowLeft: 'left', ArrowRight: 'right', KeyS: 'rear', ArrowDown: 'rear', KeyW: 'front', KeyF: 'foot', ArrowUp: 'crank', Space: 'bell' };
  function press(a) {
    if (K[a]) return; K[a] = true;
    if (a === 'L' || a === 'R') pedal(a);
    else if (a === 'foot') toggleFoot();
    else if (a === 'crank') adjustCrank();
    else if (a === 'bell') sfx.bell();
  }
  function release(a) { K[a] = false; }
  function clearKeys() { for (const k in K) K[k] = false; touchEl.querySelectorAll('.on').forEach(b => b.classList.remove('on')); }

  window.addEventListener('keydown', e => {
    if (e.code === 'Escape') { e.preventDefault(); togglePause(); return; }
    if (e.code === 'Enter' && !ov.hidden) {
      const p = ov.querySelector('[data-primary]'); if (p) { e.preventDefault(); p.click(); } return;
    }
    if (e.code === 'KeyM') { sfx.muted = !sfx.muted; toast(sfx.muted ? '已靜音（M 恢復）' : '已開啟音效', 1400); return; }
    const a = KEYMAP[e.code]; if (!a) return;
    e.preventDefault();
    if (e.repeat) return;
    if (S.mode === 'play') press(a);
  });
  window.addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) release(a); });
  window.addEventListener('blur', () => { clearKeys(); if (S.mode === 'play') togglePause(); });

  // 觸控按鈕
  let touchShown = false;
  function showTouch() { if (touchShown) return; touchShown = true; touchEl.hidden = false; }
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) showTouch();
  window.addEventListener('touchstart', showTouch, { passive: true });
  touchEl.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k;
    b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); b.classList.add('on'); sfx.init(); if (S.mode === 'play') press(k); });
    const up = () => { b.classList.remove('on'); release(k); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  // ─────────────────────────── 物理 ───────────────────────────
  function crash(type) {
    if (S.crashT) return;
    const c = CH[S.ch];
    let key = type;
    if (type === 'lean') key = (c.view === 'top' && S.v >= 2) ? 'slip' : S.v < 0.9 ? 'slow' : (S.lean < 0 ? 'left' : 'right');
    S.crashType = type; S.crashKey = key; S.crashT = 1e-4; S.attempts++;
    if (type === 'flip') S.pitch = Math.max(S.pitch, 0.2);
    hideToast(); sfx.thud();
  }

  function record() {
    S.frames.push({ x: S.x, v: S.v, lean: S.lean, steer: S.steer, crankVis: S.crankVis, wheelA: S.wheelA, pitch: S.pitch,
      footDown: S.footDown, dadX: S.dadX, dadPhase: S.dadPhase, assist: S.assist, px: S.px, py: S.py, heading: S.heading, prog: S.prog });
    if (S.frames.length > 210) S.frames.shift();
  }

  function move(dt) {
    const c = CH[S.ch];
    if (c.view === 'side') S.x += S.v * dt;
    else {
      S.heading += 9.8 * Math.tan(S.lean) / Math.max(S.v, 1.5) * dt;
      S.px += S.v * Math.sin(S.heading) * dt;
      S.py -= S.v * Math.cos(S.heading) * dt;
    }
    S.wheelA += S.v * dt / 0.35;
    S.crankVis += (S.crank - S.crankVis) * Math.min(1, dt * 12);
    // 爸爸
    if (S.assist > 0.05) { S.dadX = S.x - 1.3; S.dadV = S.v; }
    else { S.dadV = Math.max(0, S.dadV - 2.5 * dt); S.dadX += S.dadV * dt; }
    S.dadPhase += S.dadV * dt * 3.2;
  }

  function step(dt) {
    const c = CH[S.ch];
    S.t += dt;

    if (S.crashT) {
      S.crashT += dt;
      if (S.crashType === 'flip') { S.pitch = Math.min(1.9, S.pitch + dt * 4.5); S.v *= 0.9; }
      else if (S.crashType === 'overrun') { S.v = Math.max(0, S.v - 2 * dt); }
      else { S.lean = clamp(S.lean + Math.sign(S.lean || 1) * dt * 3.5, -1.5, 1.5); S.v = Math.max(0, S.v - 6 * dt); }
      move(dt); record();
      if (S.crashT > 0.8) startReplay();
      return;
    }

    // 龍頭（平滑化，輕點就是小轉向）
    const inp = (K.right ? 1 : 0) - (K.left ? 1 : 0);
    S.steer += (inp - S.steer) * Math.min(1, dt * 7);

    // 煞車與阻力
    let dec = 0.25 + 0.015 * S.v * S.v;
    if (K.rear) dec += 2.6;
    if (K.front) {
      dec += 5.5;
      if (S.v > 3.4) S.frontHold += dt; else S.frontHold = Math.max(0, S.frontHold - dt);
      if (S.v > 2.5) toastOnce('front', '前煞很猛！高速時用力按會翻車，主要用 S 後煞', 8);
    } else S.frontHold = Math.max(0, S.frontHold - dt * 2);
    S.pitch = S.frontHold * 0.4;
    if (S.frontHold > 0.35) return crash('flip');
    if (S.footDown) {
      if (S.v > 2.3) return crash('foot');
      if (S.v > 0.05) dec += 3;
    }
    S.v = Math.max(0, S.v - dec * dt);
    if (c.id === 1 && S.dadPushing && S.assist > 0) S.v = Math.max(S.v, 1.4 * S.assist);

    // 平衡：倒單擺 + 轉向修正（與速度成正比）+ 自穩 + 阻尼 + 隨機擾動
    if (S.footDown) { S.lean *= Math.pow(0.002, dt); S.leanV = 0; }
    else {
      S.noise += -2 * S.noise * dt + (Math.random() * 2 - 1) * 4.2 * Math.sqrt(dt);
      let acc = 5.0 * Math.sin(S.lean) - 0.95 * S.v * S.steer - 0.18 * S.v * S.lean - 1.4 * S.leanV + S.noise * c.noise;
      if (S.assist > 0) acc += -S.assist * (14 * S.lean + 5 * S.leanV);
      S.leanV += acc * dt; S.lean += S.leanV * dt;
      if (Math.abs(S.lean) > LEAN_MAX) return crash('lean');
      if (c.view === 'side' && S.assist < 0.5 && Math.abs(S.lean) > 0.35 && S.v > 0.9)
        toastOnce('lean', S.lean < 0 ? '往左倒了！按 ← 把龍頭轉向左邊' : '往右倒了！按 → 把龍頭轉向右邊', 4, 1800);
    }

    move(dt);

    if (c.id === 1) {
      if (S.dadPushing && S.x > 20) S.assist = Math.max(0, 1 - (S.x - 20) / 16);
      if (!S.flags.steer && S.x > 5) { S.flags.steer = 1; toast('車往哪邊倒，就按 ← 或 → 把龍頭轉向那邊', 3400); }
      if (!S.flags.release && S.x > 31) { S.flags.release = 1; toast('爸爸偷偷放手了！你自己在騎了！', 3400); sfx.ding(); }
      if (!S.flags.fast && S.x > 66) { S.flags.fast = 1; toast('發現了嗎？騎快一點，車子反而更穩'); }
      if (S.x >= c.goal) return win();
    } else if (c.id === 2) {
      const z = c.stops[S.stopIdx];
      if (z != null) {
        if (!S.flags['near' + S.stopIdx] && S.x > z - 16) { S.flags['near' + S.stopIdx] = 1; toast('前方停車格：按住 S 後煞減速，快停住時按 F 伸腳', 3400); }
        if (S.x >= z - 0.3 && S.x <= z + ZONE && S.v < 0.05 && S.footDown) {
          S.stopIdx++; sfx.ding();
          toast(S.stopIdx < c.stops.length ? `第 ${S.stopIdx} 次停車成功！起步前先看踏板鐘` : '三次停車都成功！騎到終點旗子', 3200);
        } else if (S.x > z + ZONE + 0.4) return crash('overrun');
      }
      if (S.x >= c.goal) return win();
    } else {
      const P = TRACK.pts;
      let best = 1e9, bi = S.prog;
      for (let i = Math.max(0, S.prog - 10); i < Math.min(P.length, S.prog + 30); i++) {
        const dx = P[i].x - S.px, dy = P[i].y - S.py, d = dx * dx + dy * dy;
        if (d < best) { best = d; bi = i; }
      }
      S.prog = bi;
      if (Math.sqrt(best) > 2.85) return crash('offroad');
      for (const cvv of TRACK.curves) {
        const k = 'curve' + cvv.i;
        if (!S.flags[k] && S.prog > cvv.i - 22 && S.prog < cvv.i) {
          S.flags[k] = 1;
          toast(cvv.dir > 0 ? '前方右彎：輕點 ← 讓車身往右倒，再按 → 穩住' : '前方左彎：輕點 → 讓車身往左倒，再按 ← 穩住', 3200);
        }
        if (cvv.R < 10 && S.prog > cvv.i - 30 && S.prog < cvv.i + 10 && S.v > 4.6) toastOnce('fast', '這是急彎！先按 S 減速', 5);
      }
      if (!S.flags.intro2 && S.t > 3.5) { S.flags.intro2 = 1; toast('轉彎靠傾斜：先往反方向輕點龍頭，車身就會倒向你要去的那邊', 3600); }
      if (bi >= P.length - 2) return win();
    }
    record();
  }

  // ─────────────────────────── 畫面：側視 ───────────────────────────
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function line(pts, w, col) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  }
  function ik(hx, hy, fx, fy, l1, l2, pickFront) {
    let dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy);
    d = Math.min(d, l1 + l2 - 0.01);
    const base = Math.atan2(dy, dx), a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    const k1 = [hx + l1 * Math.cos(base - a), hy + l1 * Math.sin(base - a)];
    const k2 = [hx + l1 * Math.cos(base + a), hy + l1 * Math.sin(base + a)];
    return pickFront(k1, k2);
  }

  function drawBikeSide(st, ox, oy, s) {
    ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(30,43,51,.18)'; ctx.beginPath(); ctx.ellipse(43, 2, 62, 6, 0, 0, TAU); ctx.fill();
    if (st.pitch > 0) { ctx.translate(86, 0); ctx.rotate(st.pitch); ctx.translate(-86, 0); }
    ctx.transform(1, 0, Math.sin(st.lean) * 0.22, Math.max(0.1, Math.cos(st.lean)), 0, 0);

    const BB = [36, -24], hip = [24, -86], sh = [48, -124], hand = [66, -90];
    const ca = st.crankVis;
    const pR = [BB[0] + 13 * Math.sin(ca), BB[1] - 13 * Math.cos(ca)];
    const pL = [BB[0] + 13 * Math.sin(ca + Math.PI), BB[1] - 13 * Math.cos(ca + Math.PI)];
    const front = (a, b) => (a[0] > b[0] ? a : b);

    // 遠側腳
    const kL = ik(hip[0], hip[1], pL[0], pL[1], 38, 38, front);
    line([hip, kL, pL], 8, '#2C4270');
    rr(pL[0] - 5, pL[1] - 3, 13, 6, 3); ctx.fillStyle = '#10181D'; ctx.fill();
    line([BB, pL], 3, '#8A96A0');

    // 輪子
    for (const cx of [0, 86]) {
      ctx.beginPath(); ctx.arc(cx, -27, 27, 0, TAU); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, -27, 23, 0, TAU); ctx.lineWidth = 1.5; ctx.strokeStyle = '#9AA6AE'; ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const a = st.wheelA + i * Math.PI / 3;
        line([[cx, -27], [cx + 23 * Math.cos(a), -27 + 23 * Math.sin(a)]], 1.2, '#9AA6AE');
      }
      ctx.beginPath(); ctx.arc(cx, -27, 3.5, 0, TAU); ctx.fillStyle = INK; ctx.fill();
    }
    // 車架
    line([[0, -27], BB, [28, -70], [0, -27]], 5, RED);
    line([BB, [76, -62], [74, -74], [28, -70]], 5, RED);
    line([[76, -62], [86, -27]], 4, '#B7372F');
    line([[74, -74], [70, -88], [62, -88]], 4, INK);
    line([[28, -70], [24, -80]], 4, INK);
    rr(12, -84, 24, 6, 3); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath(); ctx.arc(BB[0], BB[1], 7, 0, TAU); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();

    // 身體
    line([hip, sh], 17, YEL);
    const elbow = ik(sh[0], sh[1], hand[0], hand[1], 23, 23, (a, b) => (a[1] > b[1] ? a : b));
    // 近側腳
    const footNear = st.footDown ? [44, -2] : pR;
    const kR = ik(hip[0], hip[1], footNear[0], footNear[1], 38, 38, front);
    line([BB, pR], 3.5, '#5E6B74');
    line([hip, kR, footNear], 9, PANTS);
    rr(footNear[0] - 5, footNear[1] - 3.5, 14, 7, 3); ctx.fillStyle = INK; ctx.fill();
    line([sh, elbow], 7, YEL); line([elbow, hand], 6, SKIN);
    // 頭與安全帽
    ctx.beginPath(); ctx.arc(57, -139, 11, 0, TAU); ctx.fillStyle = SKIN; ctx.fill();
    ctx.beginPath(); ctx.arc(55, -141, 13, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); ctx.fillStyle = TEAL; ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(62, -139, 1.6, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawDad(st, x, gy, s, holding, seat) {
    ctx.save(); ctx.translate(x, gy); ctx.scale(s, s);
    const ph = st.dadPhase, run = holding || Math.abs(Math.sin(ph)) > 0.01;
    const sw = run ? Math.sin(ph) : 0;
    const hip = [0, -95], sh = [8, -160];
    ctx.fillStyle = 'rgba(30,43,51,.15)'; ctx.beginPath(); ctx.ellipse(0, 2, 26, 5, 0, 0, TAU); ctx.fill();
    line([hip, [-4 - sw * 16, -48], [-6 - sw * 30, 0]], 11, '#4A4F63');
    line([hip, [-4 + sw * 16, -48], [-6 + sw * 30, 0]], 11, '#5A6078');
    line([hip, sh], 22, '#6C8EBF');
    if (holding) {
      const hx = (seat[0] - x) / s, hy = (seat[1] - gy) / s;
      line([sh, [(sh[0] + hx) / 2 + 4, (sh[1] + hy) / 2 + 10], [hx, hy]], 8, '#6C8EBF');
    } else {
      const wave = Math.sin(st.t * 6) * 12;
      line([sh, [20, -190], [26 + wave, -214]], 8, '#6C8EBF');
    }
    ctx.beginPath(); ctx.arc(12, -180, 14, 0, TAU); ctx.fillStyle = '#E7B48D'; ctx.fill();
    ctx.beginPath(); ctx.arc(10, -186, 14, Math.PI, TAU); ctx.fillStyle = '#3A2E28'; ctx.fill();
    ctx.restore();
  }

  function drawSide(st) {
    const c = CH[S.ch];
    const s = clamp(H / 640, 0.75, 1.35), PX = 40 * s;
    const gy = Math.round(H * 0.7), bx = W * 0.32, camX = st.x * PX - bx;
    const yard = c.scene === 'yard';

    const g = ctx.createLinearGradient(0, 0, 0, gy);
    if (yard) { g.addColorStop(0, '#6FC3E0'); g.addColorStop(1, '#D6F1F4'); }
    else { g.addColorStop(0, '#76AFD4'); g.addColorStop(1, '#F7D9A6'); }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = yard ? '#FFE08A' : '#FFC673';
    ctx.beginPath(); ctx.arc(W * 0.8, gy * 0.26, 34 * s, 0, TAU); ctx.fill();

    // 雲
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let k = -1; k < W / 260 + 2; k++) {
      const kk = k + Math.floor(camX * 0.05 / 260);
      const x = kk * 260 - camX * 0.05 + hash(kk) * 80, y = gy * (0.12 + hash(kk + 9) * 0.25);
      ctx.beginPath(); ctx.ellipse(x, y, 40 * s, 14 * s, 0, 0, TAU); ctx.ellipse(x + 26 * s, y - 8 * s, 26 * s, 14 * s, 0, 0, TAU); ctx.fill();
    }

    // 遠景
    ctx.fillStyle = yard ? '#A4D38E' : '#B9C3D3';
    ctx.beginPath(); ctx.moveTo(0, gy);
    for (let x = 0; x <= W + 20; x += 20) {
      const wx = x + camX * 0.15;
      const y = yard ? gy - 70 * s - 28 * s * Math.sin(wx / 160) - 16 * s * Math.sin(wx / 57)
                     : gy - 90 * s - (Math.floor(wx / 60) % 3) * 22 * s - hash(Math.floor(wx / 60)) * 40 * s;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, gy); ctx.fill();

    // 中景
    const mid = camX * 0.45, span = yard ? 150 : 170;
    for (let k = Math.floor(mid / span) - 1; k < (mid + W) / span + 1; k++) {
      const x = k * span - mid, h = hash(k);
      if (yard) {
        if (h > 0.72) continue;
        ctx.fillStyle = '#7A5A3C'; ctx.fillRect(x - 5 * s, gy - 70 * s, 10 * s, 70 * s);
        ctx.fillStyle = h > 0.36 ? '#4E9A55' : '#5FAE5E';
        ctx.beginPath(); ctx.arc(x, gy - 88 * s, 34 * s, 0, TAU); ctx.arc(x - 24 * s, gy - 70 * s, 22 * s, 0, TAU); ctx.arc(x + 24 * s, gy - 70 * s, 24 * s, 0, TAU); ctx.fill();
      } else {
        const bw = (110 + h * 50) * s, bh = (90 + hash(k + 3) * 90) * s;
        const cols = ['#F4C542', '#E98A6B', '#7FB3A8', '#C9D6E8', '#F2A7A0'];
        ctx.fillStyle = cols[Math.floor(hash(k + 7) * cols.length)];
        ctx.fillRect(x, gy - 30 * s - bh, bw, bh);
        ctx.fillStyle = 'rgba(30,43,51,.75)';
        for (let wy = gy - 30 * s - bh + 16 * s; wy < gy - 60 * s; wy += 30 * s)
          for (let wx = x + 14 * s; wx < x + bw - 24 * s; wx += 30 * s) ctx.fillRect(wx, wy, 14 * s, 16 * s);
        ctx.fillStyle = INK; ctx.fillRect(x - 4 * s, gy - 34 * s - bh, bw + 8 * s, 6 * s);
      }
    }

    if (yard) {
      // 房子（起點）
      const hx = -7 * PX - camX * 0.85;
      if (hx > -300 * s && hx < W) {
        ctx.fillStyle = '#F7EEDC'; ctx.fillRect(hx, gy - 150 * s, 200 * s, 150 * s);
        ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(hx - 16 * s, gy - 150 * s); ctx.lineTo(hx + 100 * s, gy - 220 * s); ctx.lineTo(hx + 216 * s, gy - 150 * s); ctx.fill();
        ctx.fillStyle = '#6FA8C8'; ctx.fillRect(hx + 30 * s, gy - 120 * s, 44 * s, 40 * s); ctx.fillRect(hx + 126 * s, gy - 120 * s, 44 * s, 40 * s);
        ctx.fillStyle = '#8A5A3C'; ctx.fillRect(hx + 84 * s, gy - 80 * s, 32 * s, 80 * s);
      }
      // 籬笆
      const f = camX * 0.9, fs = PX * 0.9;
      ctx.fillStyle = '#E9D2A6'; ctx.strokeStyle = '#A9825A'; ctx.lineWidth = 1.5;
      for (let k = Math.floor(f / fs) - 1; k < (f + W) / fs + 1; k++) {
        const x = k * fs - f;
        rr(x, gy - 50 * s, 12 * s, 52 * s, [5 * s, 5 * s, 0, 0]); ctx.fill(); ctx.stroke();
      }
      ctx.fillRect(0, gy - 38 * s, W, 6 * s); ctx.fillRect(0, gy - 18 * s, W, 6 * s);
      // 草地與割草紋
      ctx.fillStyle = '#7DB65F'; ctx.fillRect(0, gy, W, H - gy);
      ctx.fillStyle = '#88C26A';
      for (let m = Math.floor(camX / (PX * 2)) - 1; m < (camX + W) / (PX * 2) + 1; m++) {
        const x = m * 2 * PX - camX;
        ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + PX, gy); ctx.lineTo(x + PX - 60 * s, H); ctx.lineTo(x - 60 * s, H); ctx.fill();
      }
      ctx.fillStyle = '#5E9A48'; ctx.fillRect(0, gy - 1, W, 3);
      // 距離樁
      ctx.font = `700 ${12 * s}px ${NUMF}`; ctx.textAlign = 'center';
      for (let m = Math.ceil(camX / PX / 10) * 10; m * PX - camX < W + 40; m += 10) {
        if (m <= 0 || m >= c.goal) continue;
        const x = m * PX - camX;
        ctx.fillStyle = '#A9825A'; ctx.fillRect(x - 2 * s, gy + 4 * s, 4 * s, 16 * s);
        ctx.fillStyle = '#fff'; rr(x - 16 * s, gy + 18 * s, 32 * s, 16 * s, 4 * s); ctx.fill();
        ctx.fillStyle = INK; ctx.fillText(m + 'm', x, gy + 30 * s);
      }
    } else {
      // 人行道、馬路
      ctx.fillStyle = '#D8CFC0'; ctx.fillRect(0, gy - 30 * s, W, 24 * s);
      ctx.fillStyle = '#B9AE9C'; ctx.fillRect(0, gy - 8 * s, W, 4 * s);
      ctx.fillStyle = '#4A5560'; ctx.fillRect(0, gy - 4 * s, W, 70 * s);
      ctx.fillStyle = '#F4F1E8';
      for (let m = Math.floor(camX / (PX * 3)) - 1; m < (camX + W) / (PX * 3) + 1; m++) ctx.fillRect(m * 3 * PX - camX, gy + 40 * s, PX * 1.6, 5 * s);
      ctx.fillStyle = '#CFC6B8'; ctx.fillRect(0, gy + 66 * s, W, H - gy);
      // 停車格
      c.stops.forEach((z, i) => {
        const x0 = z * PX - camX, x1 = (z + ZONE) * PX - camX;
        if (x1 < -80 || x0 > W + 80) return;
        const done = i < S.stopIdx;
        ctx.fillStyle = done ? 'rgba(42,157,143,.35)' : 'rgba(244,197,66,.28)';
        ctx.fillRect(x0, gy - 2 * s, x1 - x0, 32 * s);
        ctx.strokeStyle = '#F4F1E8'; ctx.lineWidth = 3 * s; ctx.strokeRect(x0, gy - 2 * s, x1 - x0, 32 * s);
        ctx.fillStyle = '#F4F1E8'; ctx.fillRect(x1, gy - 2 * s, 7 * s, 32 * s);
        ctx.font = `900 ${20 * s}px ${FONT}`; ctx.textAlign = 'center';
        ctx.fillText(done ? '✓' : '停', (x0 + x1) / 2, gy + 22 * s);
        // 停車牌
        const px = x1 + 18 * s;
        ctx.fillStyle = '#8A96A0'; ctx.fillRect(px - 2 * s, gy - 100 * s, 4 * s, 72 * s);
        ctx.fillStyle = done ? TEAL : RED; ctx.beginPath();
        for (let j = 0; j < 8; j++) { const a = Math.PI / 8 + j * Math.PI / 4; ctx.lineTo(px + 17 * s * Math.cos(a), gy - 110 * s + 17 * s * Math.sin(a)); }
        ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = `900 ${14 * s}px ${FONT}`; ctx.fillText('停', px, gy - 105 * s);
      });
    }

    // 終點旗
    const fx = c.goal * PX - camX;
    if (fx > -60 && fx < W + 60) {
      ctx.fillStyle = INK; ctx.fillRect(fx - 2 * s, gy - 120 * s, 4 * s, 120 * s);
      for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) {
        ctx.fillStyle = (i + j) % 2 ? '#fff' : INK;
        ctx.fillRect(fx + 2 * s + i * 12 * s, gy - 120 * s + j * 11 * s, 12 * s, 11 * s);
      }
    }

    // 爸爸與腳踏車
    const originX = bx - 43 * s;
    const seat = [originX + 24 * s, gy - 82 * s * Math.cos(st.lean)];
    const holding = c.id === 1 && st.assist > 0.05;
    if (c.id === 1) {
      const dx = st.dadX * PX - camX;
      if (dx > -100 && dx < W + 100) drawDad(st, dx, gy, s * 0.95, holding, seat);
    }
    drawBikeSide(st, originX, gy, s);
  }

  // ─────────────────────────── 畫面：俯視 ───────────────────────────
  function drawTop(st) {
    const s = clamp(Math.min(W, H) / 600, 0.8, 1.4), PX = 22 * s;
    const cx = W / 2, cy = H * 0.64;
    ctx.fillStyle = '#86C06C'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-st.heading); ctx.scale(PX, PX); ctx.translate(-st.px, -st.py);
    const view = Math.hypot(W, H) / PX;
    for (const d of TRACK.deco) {
      if (d.k !== 'flower' || Math.abs(d.x - st.px) > view || Math.abs(d.y - st.py) > view) continue;
      ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.35, 0, TAU); ctx.arc(d.x + d.r * 0.5, d.y + 0.2, d.r * 0.3, 0, TAU); ctx.fill();
    }
    const P = TRACK.pts;
    const pathStroke = (w, col, dash) => {
      ctx.beginPath(); ctx.moveTo(P[0].x, P[0].y);
      for (let i = 1; i < P.length; i++) ctx.lineTo(P[i].x, P[i].y);
      ctx.lineWidth = w; ctx.strokeStyle = col; ctx.lineCap = 'butt'; ctx.lineJoin = 'round';
      ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
    };
    pathStroke(5.8, '#B8975E'); pathStroke(5, '#EBD9A6'); pathStroke(0.14, 'rgba(255,255,255,.8)', [0.9, 0.9]);
    // 起終點線
    const endLine = (p, checker) => {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.h);
      for (let i = 0; i < 10; i++) for (let j = 0; j < 2; j++) {
        ctx.fillStyle = checker ? ((i + j) % 2 ? '#fff' : INK) : '#fff';
        if (checker || j === 0) ctx.fillRect(-2.5 + i * 0.5, -0.5 + j * 0.5, 0.5, 0.5);
      }
      ctx.restore();
    };
    endLine(P[4], false); endLine(P[P.length - 2], true);
    for (const d of TRACK.deco) {
      if (d.k !== 'tree' || Math.abs(d.x - st.px) > view || Math.abs(d.y - st.py) > view) continue;
      ctx.fillStyle = 'rgba(20,50,20,.25)'; ctx.beginPath(); ctx.arc(d.x + 0.5, d.y + 0.5, d.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#3F8A4E'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5BAA62'; ctx.beginPath(); ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.5, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // 腳踏車（俯視，車頭朝上）
    const bs = s * 1.1, sl = Math.sin(st.lean);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(bs, bs);
    ctx.fillStyle = 'rgba(20,40,20,.28)'; ctx.beginPath(); ctx.ellipse(sl * 18 + 3, 4, 9 + Math.abs(sl) * 10, 34, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = INK; rr(-3.5, 12, 7, 26, 3); ctx.fill();
    line([[0, 22], [0, -20]], 5, RED);
    ctx.save(); ctx.translate(0, -22); ctx.rotate(st.steer * 0.35);
    ctx.fillStyle = INK; rr(-3.5, -14, 7, 26, 3); ctx.fill();
    line([[-14, 0], [14, 0]], 3, INK);
    ctx.restore();
    ctx.translate(sl * 12, 0);
    line([[-12, -4], [-13, -20]], 5, YEL); line([[12, -4], [13, -20]], 5, YEL);
    ctx.fillStyle = YEL; ctx.beginPath(); ctx.ellipse(0, -2, 14, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = TEAL; ctx.beginPath(); ctx.arc(0, -5, 8, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-1.2, -12, 2.4, 13);
    ctx.restore();
  }

  // ─────────────────────────── HUD ───────────────────────────
  function progress(st) {
    const c = CH[S.ch];
    return c.view === 'side' ? clamp(st.x / c.goal, 0, 1) : clamp(st.prog / (TRACK.pts.length - 1), 0, 1);
  }
  function drawHUD(st) {
    const c = CH[S.ch], top = 14;
    ctx.textBaseline = 'middle';
    ctx.font = `900 14px ${FONT}`; ctx.textAlign = 'left';
    const label = `第 ${c.id} 章　${c.name}`, lw = ctx.measureText(label).width + 28;
    ctx.fillStyle = INK; rr(16, top, lw, 32, 16); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(label, 30, top + 17);
    const pw = Math.min(240, W * 0.42);
    ctx.fillStyle = 'rgba(255,255,255,.75)'; rr(16, top + 42, pw, 10, 5); ctx.fill();
    ctx.fillStyle = YEL; rr(16, top + 42, Math.max(10, pw * progress(st)), 10, 5); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; rr(16, top + 42, pw, 10, 5); ctx.stroke();
    if (c.id === 2) {
      ctx.font = `700 12px ${FONT}`; ctx.fillStyle = INK;
      ctx.fillText(`停車 ${Math.min(S.stopIdx, 3)} / 3`, 16 + pw + 10, top + 48);
    }
    // 速度
    ctx.textAlign = 'right'; ctx.fillStyle = INK;
    ctx.font = `800 34px ${NUMF}`; ctx.fillText(String(Math.round(st.v * 3.6)), W - 62, top + 20);
    ctx.font = `700 12px ${FONT}`; ctx.fillText('km/h', W - 18, top + 24);

    // 水平儀
    const vw = Math.min(320, W - 32), vx = (W - vw) / 2, vy = top + 70, vh = 22;
    const grd = ctx.createLinearGradient(vx, 0, vx + vw, 0);
    grd.addColorStop(0, '#F4A08F'); grd.addColorStop(0.18, '#E8F6C9'); grd.addColorStop(0.82, '#E8F6C9'); grd.addColorStop(1, '#F4A08F');
    ctx.fillStyle = grd; rr(vx, vy, vw, vh, 11); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; rr(vx, vy, vw, vh, 11); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(30,43,51,.5)';
    for (const f of [-0.5, 0, 0.5]) { const x = W / 2 + f * (vw / 2 - 16); ctx.beginPath(); ctx.moveTo(x, vy + 4); ctx.lineTo(x, vy + vh - 4); ctx.stroke(); }
    const bxp = W / 2 + clamp(st.lean / LEAN_MAX, -1, 1) * (vw / 2 - 16);
    ctx.fillStyle = Math.abs(st.lean) > 0.5 ? '#FFD7CF' : '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(bxp, vy + vh / 2, 14, 7, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.ellipse(bxp - 4, vy + vh / 2 - 2, 4, 2, 0, 0, TAU); ctx.fill();
    ctx.font = `900 16px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillStyle = st.steer < -0.15 ? RED : 'rgba(30,43,51,.3)'; ctx.fillText('◀', vx - 12, vy + vh / 2 + 1);
    ctx.fillStyle = st.steer > 0.15 ? RED : 'rgba(30,43,51,.3)'; ctx.fillText('▶', vx + vw + 12, vy + vh / 2 + 1);
    ctx.font = `700 11px ${FONT}`; ctx.fillStyle = INK; ctx.fillText('平衡', W / 2, vy + vh + 12);

    // 左下：後視窗 + 踏板鐘 + 節奏
    const pad = touchShown ? touchEl.offsetHeight + 8 : 16;
    const base = H - pad;
    const rx = 16 + 44, ry = base - 44;
    ctx.save();
    ctx.beginPath(); ctx.arc(rx, ry, 44, 0, TAU); ctx.fillStyle = '#DDF1F6'; ctx.fill(); ctx.clip();
    ctx.fillStyle = '#9DCB82'; ctx.fillRect(rx - 44, ry + 22, 88, 30);
    ctx.translate(rx, ry + 22); ctx.rotate(st.lean);
    line([[0, 0], [0, -22]], 6, INK);
    line([[0, -22], [0, -34]], 4, RED);
    line([[-12, -38], [12, -38]], 3, INK);
    line([[0, -34], [0, -52]], 14, YEL);
    ctx.fillStyle = TEAL; ctx.beginPath(); ctx.arc(0, -60, 8, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(rx, ry, 44, 0, TAU); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.font = `700 11px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center';
    ctx.fillText('後視', rx, ry - 30);

    const dx = rx + 44 + 16 + 32, dy = base - 36;
    ctx.beginPath(); ctx.arc(dx, dy, 32, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(dx, dy, 26, -Math.PI / 2 + 0.3, -Math.PI / 2 + 1.8); ctx.strokeStyle = '#9ED9A0'; ctx.lineWidth = 8; ctx.stroke();
    for (let i = 0; i < 12; i++) {
      const a = i * TAU / 12;
      line([[dx + 27 * Math.sin(a), dy - 27 * Math.cos(a)], [dx + 31 * Math.sin(a), dy - 31 * Math.cos(a)]], i % 3 ? 1 : 2, INK);
    }
    const ca = st.crankVis;
    line([[dx, dy], [dx - 18 * Math.sin(ca), dy + 18 * Math.cos(ca)]], 3, '#9AA6AE');
    line([[dx, dy], [dx + 20 * Math.sin(ca), dy - 20 * Math.cos(ca)]], 4, RED);
    ctx.beginPath(); ctx.arc(dx + 20 * Math.sin(ca), dy - 20 * Math.cos(ca), 4.5, 0, TAU); ctx.fillStyle = RED; ctx.fill();
    ctx.beginPath(); ctx.arc(dx, dy, 32, 0, TAU); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = INK; ctx.font = `700 11px ${FONT}`; ctx.fillText('右踏板', dx, dy + 44);

    const fx0 = dx + 32 + 18;
    ['L', 'R'].forEach((f, i) => {
      const on = S.lastFoot === f && S.t - S.lastPedalT < 0.18;
      ctx.fillStyle = on ? YEL : 'rgba(255,255,255,.85)';
      rr(fx0 + i * 34, base - 54, 28, 36, 10); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = INK; ctx.font = `800 15px ${NUMF}`; ctx.fillText(f === 'L' ? 'A' : 'D', fx0 + i * 34 + 14, base - 36);
    });
    if (S.combo >= 3) { ctx.font = `800 13px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = RED; ctx.fillText(`節奏 ×${S.combo}`, fx0, base - 64); }
    if (st.footDown) { ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = INK; ctx.fillText('腳踩地中', fx0, base - 8); }
    ctx.textBaseline = 'alphabetic';
  }

  function drawReplay() {
    const r = REASONS[S.crashKey] || ['摔車了', ''];
    ctx.fillStyle = 'rgba(30,43,51,.18)'; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    const bw = Math.min(W - 32, 420), bx = (W - bw) / 2, by = H * 0.3;
    ctx.fillStyle = '#fff'; rr(bx, by, bw, 64, 14); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(bx + 22, by + 20, 6, 0, TAU); ctx.fill();
    ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = INK; ctx.fillText('慢動作重播 ×0.35', bx + 34, by + 20);
    ctx.font = `900 20px ${FONT}`; ctx.fillText(r[0], bx + 16, by + 45);
    ctx.textBaseline = 'alphabetic';
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const c = CH[S.ch];
    const st = (S.mode === 'replay' || S.mode === 'crash') && S.frames.length
      ? Object.assign({}, S, S.frames[Math.floor(Math.min(S.rp, S.frames.length - 1))]) : S;
    if (c.view === 'side') drawSide(st); else drawTop(st);
    if (['play', 'replay', 'pause', 'crash'].includes(S.mode)) drawHUD(st);
    if (S.mode === 'replay') drawReplay();
  }

  // ─────────────────────────── 流程與面板 ───────────────────────────
  function openOv(html) {
    ov.innerHTML = html; ov.hidden = false;
    const p = ov.querySelector('[data-primary]'); if (p) setTimeout(() => p.focus({ preventScroll: true }), 30);
  }
  function closeOv() { ov.hidden = true; ov.innerHTML = ''; }
  const on = (sel, fn) => { const el = ov.querySelector(sel); if (el) el.onclick = () => { sfx.init(); fn(); }; };

  function keysHTML() {
    if (touchShown) return '<p class="lead">手機操作：右下角左右腳交替點按踩踏板，左下角轉龍頭，上排是煞車、放腳與轉踏板。</p>';
    const k = [['A', 'D', '左右腳交替踩'], ['←', '→', '龍頭轉向'], ['S', '', '後煞'], ['W', '', '前煞（很猛）'], ['F', '', '伸腳落地'], ['↑', '', '倒轉踏板'], ['空白鍵', '', '鈴鐺'], ['Esc', '', '暫停']];
    return '<div class="keys">' + k.map(([a, b, t]) => `<span><kbd>${a}</kbd>${b ? `<kbd>${b}</kbd>` : ''}${t}</span>`).join('') + '</div>';
  }

  function showMenu() {
    S.mode = 'menu'; clearKeys(); hideToast();
    const done = loadDone();
    let firstOpen = -1;
    let html = `<div class="card"><p class="eyebrow">腳踏車學騎遊戲</p><h1>平衡之道</h1>
      <p class="lead">從跌倒到飛馳。每一章學一個真正騎車用得到的技巧，摔車時會用慢動作告訴你原因。</p><div class="chs">`;
    CH.forEach((c, i) => {
      const open = i === 0 || done.includes(CH[i - 1].id), ok = done.includes(c.id);
      if (open && !ok && firstOpen < 0) firstOpen = i;
      html += `<button class="ch" data-ch="${i}" ${open ? '' : 'disabled'} ${''}><span class="num">${c.id}</span>
        <span class="meta"><b>${c.name}</b><small>${c.sub}</small></span>
        <span class="st ${ok ? 'ok' : ''}">${ok ? '已通關' : open ? '開始' : '先完成上一章'}</span></button>`;
    });
    FUTURE.forEach(f => html += `<div class="ch soon"><span class="num">${f.id}</span><span class="meta"><b>${f.name}</b><small>${f.sub}</small></span><span class="st">製作中</span></div>`);
    html += `</div>${keysHTML()}</div>`;
    openOv(html);
    const btns = ov.querySelectorAll('[data-ch]');
    btns.forEach(b => b.onclick = () => { sfx.init(); selectCh(+b.dataset.ch); });
    btns[firstOpen < 0 ? 0 : firstOpen].setAttribute('data-primary', '');
    btns[firstOpen < 0 ? 0 : firstOpen].focus({ preventScroll: true });
  }

  function selectCh(i) { S.ch = i; S.attempts = 0; resetRun(); showIntro(); }

  function showIntro() {
    const c = CH[S.ch];
    S.mode = 'intro';
    openOv(`<div class="card"><p class="eyebrow">第 ${c.id} 章．${c.sub}</p><h2>${c.name}</h2>
      <p class="story">${c.story}</p><p class="goal">目標：${c.goalText}</p>
      <ul class="pts">${c.points.map(p => `<li>${p}</li>`).join('')}</ul>
      <div class="row"><button class="btn primary" id="go" data-primary>開始騎（Enter）</button><button class="btn" id="back">回選單</button></div></div>`);
    on('#go', startPlay); on('#back', showMenu);
  }

  function startPlay() {
    const c = CH[S.ch];
    closeOv(); clearKeys(); resetRun(); S.mode = 'play'; last = performance.now(); acc = 0;
    if (c.id === 1) toast(touchShown ? '左右腳按鈕交替點，爸爸會扶著你' : '按 A、D 左右交替踩踏板，爸爸會扶著你', 3400);
    else if (c.id === 2) toast('你一腳踩地停著。先看左下角的踏板鐘，按 ↑ 把紅色踏板轉進綠色區，再按 D 起步', 4600);
    else toast('公園彎道：視角從上往下看，車頭永遠朝上', 3000);
  }

  function startReplay() { S.mode = 'replay'; S.rp = 0; S.rpDone = false; clearKeys(); }

  function showCrash() {
    const r = REASONS[S.crashKey] || ['摔車了', ''];
    S.mode = 'crash';
    openOv(`<div class="card"><p class="eyebrow">摔車了．第 ${S.attempts} 次</p><h2>${r[0]}</h2><p>${r[1]}</p>
      <div class="row"><button class="btn primary" id="retry" data-primary>再試一次（Enter）</button>
      <button class="btn" id="again">再看重播</button><button class="btn" id="back">回選單</button></div></div>`);
    on('#retry', startPlay); on('#again', () => { closeOv(); startReplay(); }); on('#back', showMenu);
  }

  function win() {
    const c = CH[S.ch];
    S.mode = 'win'; clearKeys(); hideToast(); markDone(c.id); sfx.win();
    const next = S.ch + 1 < CH.length;
    const t = S.t, mm = Math.floor(t / 60), ss = Math.floor(t % 60).toString().padStart(2, '0');
    openOv(`<div class="card"><p class="eyebrow">過關！</p><h2>${c.name}</h2>
      <div class="stats"><div class="stat"><b>${mm}:${ss}</b><small>用時</small></div><div class="stat"><b>${S.attempts}</b><small>摔車次數</small></div></div>
      <div class="know"><b>騎車小知識：${c.card[0]}</b><p>${c.card[1]}</p></div>
      <div class="row">${next ? '<button class="btn primary" id="next" data-primary>下一章（Enter）</button>' : ''}
      <button class="btn ${next ? '' : 'primary'}" id="back" ${next ? '' : 'data-primary'}>回選單</button></div>
      ${next ? '' : '<p class="lead">第 4 到 6 章（上坡下坡、城市通勤、雨夜挑戰）還在製作中。</p>'}</div>`);
    on('#next', () => selectCh(S.ch + 1)); on('#back', showMenu);
  }

  function togglePause() {
    if (S.mode === 'play') {
      S.mode = 'pause'; clearKeys();
      openOv(`<div class="card"><p class="eyebrow">暫停</p><h2>${CH[S.ch].name}</h2>${keysHTML()}
        <div class="row"><button class="btn primary" id="res" data-primary>繼續（Enter）</button><button class="btn" id="rst">重來</button>
        <button class="btn" id="mute">${sfx.muted ? '開啟音效' : '靜音'}</button><button class="btn" id="back">回選單</button></div></div>`);
      on('#res', resume); on('#rst', startPlay); on('#back', showMenu);
      on('#mute', () => { sfx.muted = !sfx.muted; ov.querySelector('#mute').textContent = sfx.muted ? '開啟音效' : '靜音'; });
    } else if (S.mode === 'pause') resume();
  }
  function resume() { closeOv(); S.mode = 'play'; last = performance.now(); acc = 0; }

  // ─────────────────────────── 主迴圈 ───────────────────────────
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (S.mode === 'play') {
      acc += dt;
      while (acc >= 1 / 60 && S.mode === 'play') { step(1 / 60); acc -= 1 / 60; }
    } else if (S.mode === 'replay') {
      S.rp += dt * 60 * 0.35;
      if (S.rp >= S.frames.length - 1) {
        S.rp = S.frames.length - 1;
        if (!S.rpDone) { S.rpDone = true; setTimeout(() => { if (S.mode === 'replay') showCrash(); }, 600); }
      }
    }
    sfx.update();
    render();
    requestAnimationFrame(frame);
  }

  resetRun();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
